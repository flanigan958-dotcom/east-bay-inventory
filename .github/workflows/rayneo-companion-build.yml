name: RayNeo Companion Android Build

on:
  push:
    branches:
      - agent/rayneo-companion-build-20260812
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build payload
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Rehydrate RayNeo Companion source
        shell: bash
        run: |
          cat rayneo-build/parts/*.b64 | base64 -d > /tmp/rayneo.tar.xz
          mkdir -p rayneo-build/src
          tar -xJf /tmp/rayneo.tar.xz -C rayneo-build/src
          if [ -d rayneo-build/patches ]; then
            cp -a rayneo-build/patches/. rayneo-build/src/RayNeoCompanion/
          fi
          test -f rayneo-build/src/RayNeoCompanion/settings.gradle

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: rayneo-build/src/RayNeoCompanion
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee /tmp/rayneo-unit-tests.log

      - name: Upload compile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-Companion-compile-diagnostics
          path: /tmp/rayneo-unit-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop on unit-test failure
        if: steps.unit_tests.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Android lint
        working-directory: rayneo-build/src/RayNeoCompanion
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: rayneo-build/src/RayNeoCompanion
        run: gradle --no-daemon assembleDebug

      - name: Stage distributable
        shell: bash
        run: |
          mkdir -p dist
          cp rayneo-build/src/RayNeoCompanion/app/build/outputs/apk/debug/app-debug.apk dist/RayNeo-Companion-v2.0.0-debug.apk
          (cd dist && sha256sum RayNeo-Companion-v2.0.0-debug.apk > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayNeo-Companion-v2.0.0
          path: dist/
          if-no-files-found: error
          retention-days: 30

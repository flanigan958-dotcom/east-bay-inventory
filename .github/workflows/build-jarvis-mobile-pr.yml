name: Verify Jarvis One Native Mic APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          mkdir -p jarvis-app
          cat jarvis-build/native.part00 jarvis-build/native.part01 jarvis-build/native.part02 jarvis-build/native.part03 jarvis-build/native.part04 > jarvis-project.tar.xz.b64
          base64 --decode jarvis-project.tar.xz.b64 > jarvis-project.tar.xz
          tar -xJf jarvis-project.tar.xz -C jarvis-app
          test -f jarvis-app/settings.gradle
          test -f jarvis-app/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        run: gradle -p jarvis-app :app:assembleDebug --stacktrace

      - name: Package installer
        run: |
          test -s jarvis-app/app/build/outputs/apk/debug/app-debug.apk
          cp jarvis-app/app/build/outputs/apk/debug/app-debug.apk Jarvis-One-Native-Mic-Test.apk
          sha256sum Jarvis-One-Native-Mic-Test.apk > Jarvis-One-Native-Mic-Test.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-One-Native-Mic-Test
          path: |
            Jarvis-One-Native-Mic-Test.apk
            Jarvis-One-Native-Mic-Test.apk.sha256
          if-no-files-found: error
          retention-days: 30
